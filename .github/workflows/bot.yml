name: Ali101 V2Ray Bot

on:
  schedule:
  - cron: "*/20 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  send-message:

    runs-on: ubuntu-latest

    steps:

    - name: Download code
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install library
      run: |
        pip install python-telegram-bot

    - name: Run bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL: ${{ secrets.CHANNEL }}

      run: |
        python bot.py

    - name: Save index
      run: |
        git config --global user.name "Ali101 Bot"
        git config --global user.email "bot@ali101.com"
        git add index.txt
        git commit -m "Update config index" || exit 0
        git push
