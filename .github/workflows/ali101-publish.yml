name: Ali101 - Send one V2Ray config

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send for manual testing?'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ali101-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send one V2Ray config
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '@Ali101_free_V2ray'
          SEND_INTERVAL_MINUTES: '10'
          ENABLE_TCP_CHECK: '0'
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
        run: python bot.py

      - name: Save bot state
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "Update Ali101 bot state"
            git pull --rebase
            git push
          fi
